
name: OJTrack CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ojtrack-production
  cancel-in-progress: false

jobs:

  # ==========================================
  # BUILD EXPO
  # ==========================================
  build-expo:
    name: Build Expo Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Export Expo web
        working-directory: app
        run: npx expo export --platform web

      - name: Prepare deployment files
        run: |
          test -f app/dist/index.html
          mkdir -p expo-deploy
          cp -a app/dist/. expo-deploy/
          cp deploy/main.htaccess expo-deploy/.htaccess

      - name: Upload Expo artifact
        uses: actions/upload-artifact@v4
        with:
          name: expo-production
          path: expo-deploy/
          if-no-files-found: error
          retention-days: 1

  # ==========================================
  # BUILD LARAVEL
  # ==========================================
  build-laravel:
    name: Build Laravel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, ctype, fileinfo, openssl, pdo, pdo_mysql, tokenizer, xml, curl, zip
          coverage: none

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Prepare Laravel deployment files
        run: |
          test -f backend/artisan
          test -f backend/.htaccess
          test -f backend/public/.htaccess

          mkdir -p laravel-deploy
          rsync -a backend/ laravel-deploy/

      - name: Upload Laravel artifact
        uses: actions/upload-artifact@v4
        with:
          name: laravel-production
          path: laravel-deploy/
          if-no-files-found: error
          retention-days: 1

  # ==========================================
  # DEPLOY EXPO TO MAIN DOMAIN
  # ==========================================
  deploy-expo:
    name: Deploy Expo
    runs-on: ubuntu-latest
    needs: build-expo

    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
      HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
      HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
      MAIN_DEPLOY_PATH: ${{ vars.MAIN_DEPLOY_PATH }}
      WEB_DEPLOY_PATH: ${{ vars.WEB_DEPLOY_PATH }}

    steps:
      - name: Download Expo artifact
        uses: actions/download-artifact@v4
        with:
          name: expo-production
          path: expo-deploy

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check remote directory
        run: |
          ssh -p "$HOSTINGER_PORT" \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "test -d '$MAIN_DEPLOY_PATH'"

      - name: Deploy Expo files
        run: |
          rsync -avzn --delete \
            --exclude='/web/' \
            --exclude='/index.php' \
            --exclude='/default.php' \
            --exclude='/test/' \
            --exclude='/ojtrack-backend.zip' \
            -e "ssh -p $HOSTINGER_PORT -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            expo-deploy/ \
            "$HOSTINGER_USER@$HOSTINGER_HOST:$MAIN_DEPLOY_PATH/"

  # ==========================================
  # DEPLOY LARAVEL TO WEB SUBDOMAIN
  # ==========================================
  deploy-laravel:
    name: Deploy Laravel
    runs-on: ubuntu-latest
    needs: build-laravel

    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
      HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
      HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
      MAIN_DEPLOY_PATH: ${{ vars.MAIN_DEPLOY_PATH }}
      WEB_DEPLOY_PATH: ${{ vars.WEB_DEPLOY_PATH }}

    steps:
      - name: Download Laravel artifact
        uses: actions/download-artifact@v4
        with:
          name: laravel-production
          path: laravel-deploy

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify Laravel server directories
        run: |
          ssh -p "$HOSTINGER_PORT" \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "test -f '$WEB_DEPLOY_PATH/.env' &&
             test -d '$WEB_DEPLOY_PATH/storage' &&
             test -d '$WEB_DEPLOY_PATH/public'"

      - name: Deploy Laravel files
        run: |
          rsync -avzn --delete \
            --exclude='/.env' \
            --exclude='/.env.*' \
            --exclude='/storage/app/templates/default.docx' \
            --exclude='/public/storage' \
            --exclude='/bootstrap/cache/' \
            --exclude='/.git/' \
            --exclude='/node_modules/' \
            -e "ssh -p $HOSTINGER_PORT -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            laravel-deploy/ \
            "$HOSTINGER_USER@$HOSTINGER_HOST:$WEB_DEPLOY_PATH/"

      - name: Copy default DOCX template
        if: ${{ vars.DEPLOY_LIVE == 'true' }}
        run: |
          ssh -p "$HOSTINGER_PORT" \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "mkdir -p '$WEB_DEPLOY_PATH/storage/app/templates' &&
             test -f '/home/u944554553/domains/ojtrack.online/templates/default.docx' &&
             cp '/home/u944554553/domains/ojtrack.online/templates/default.docx' \
                '$WEB_DEPLOY_PATH/storage/app/templates/default.docx'"

      - name: Refresh Laravel caches
        if: ${{ vars.DEPLOY_LIVE == 'true' }}
        run: |
          ssh -p "$HOSTINGER_PORT" \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "cd '$WEB_DEPLOY_PATH' &&
             chmod -R ug+rwX storage bootstrap/cache &&
             php artisan optimize:clear &&
             php artisan package:discover --ansi &&
             php artisan config:cache &&
             php artisan view:cache"

  # ==========================================
  # DEPLOYMENT STATUS
  # ==========================================
  deployment-status:
    name: Deployment Status
    runs-on: ubuntu-latest
    needs:
      - deploy-expo
      - deploy-laravel

    steps:
      - name: Success
        run: |
          if [ "${{ vars.DEPLOY_LIVE }}" = "true" ]; then
            echo "OJTrack Expo and Laravel deployments completed successfully!"
          else
            echo "OJTrack deployment dry-run completed. No live files were deployed."
          fi
